name: Project checks

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Disposable localhost Docker Compose CI container only, never a live service credential.
      POSTGRES_PASSWORD: CI_SYNTHETIC_DISPOSABLE_ONLY
      DATABASE_URL: postgresql://ecommerce:CI_SYNTHETIC_DISPOSABLE_ONLY@127.0.0.1:5432/ecommerce
      TEST_DATABASE_URL: postgresql://ecommerce:CI_SYNTHETIC_DISPOSABLE_ONLY@127.0.0.1:5432/ecommerce_test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start fresh local PostgreSQL using the documented Compose setup
        run: docker compose config --quiet && npm run db:start
      - name: Check migration history
        run: npm run db:check
      - name: Check environment, lint, types, tests, and build
        run: npm run check
      - name: Native PostgreSQL and terminal regression tests
        run: npm run test:db
      - name: Migrate and seed local application database
        run: npm run db:migrate && npm run db:seed
      - name: Check database-backed development pages
        run: npm run smoke:dev
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Remove this disposable CI database
        if: always()
        run: docker compose down --volumes
